x-java: &java
  restart: unless-stopped
  depends_on: [db]
x-env: &env
  DB_USER: banco
  DB_PASS: ${DB_PASSWORD}
  JWT_SECRET: ${JWT_SECRET}
  BANK_NAME: ${BANK_NAME}
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment: { POSTGRES_USER: banco, POSTGRES_PASSWORD: "${DB_PASSWORD}" }
    volumes: ["dbdata:/var/lib/postgresql/data", "./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
  contas-service:
    <<: *java
    build: { context: ., args: { SERVICE: contas-service } }
    environment: { <<: *env, DB_URL: "jdbc:postgresql://db:5432/contas_db" }
  transacoes-service:
    <<: *java
    build: { context: ., args: { SERVICE: transacoes-service } }
    environment: { <<: *env, DB_URL: "jdbc:postgresql://db:5432/transacoes_db", CONTAS_URL: "http://contas-service:8082" }
  auth-service:
    <<: *java
    build: { context: ., args: { SERVICE: auth-service } }
    environment: { <<: *env, DB_URL: "jdbc:postgresql://db:5432/auth_db", CONTAS_URL: "http://contas-service:8082", ADMIN_EMAIL: "${ADMIN_EMAIL}", ADMIN_SENHA: "${ADMIN_SENHA}" }
  gateway:
    restart: unless-stopped
    build: { context: ., args: { SERVICE: gateway } }
    environment: { JWT_SECRET: "${JWT_SECRET}" }
    depends_on: [auth-service, contas-service, transacoes-service]
  backoffice:
    restart: unless-stopped
    build: ./backoffice
  nginx:
    image: nginx:1.27
    restart: unless-stopped
    ports: ["8080:8080", "443:443"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro", "/etc/letsencrypt:/etc/letsencrypt:ro", "/var/www/certbot:/var/www/certbot:ro"]
    depends_on: [gateway, backoffice]
volumes:
  dbdata: {}
